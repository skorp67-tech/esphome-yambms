name: Build Anern YamBMS firmware

on:
  push:
    branches:
      - anern-bridge
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ESPHome
        run: python -m pip install --upgrade esphome

      - name: Prepare Wi-Fi secrets
        env:
          WIFI_SSID: ${{ secrets.WIFI_SSID || 'CHANGE_WIFI_NAME' }}
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD || 'CHANGE_WIFI_PASSWORD' }}
        run: |
          python - <<'PY'
          import json, os
          with open("secrets.yaml", "w", encoding="utf-8") as f:
              f.write("wifi_ssid: " + json.dumps(os.environ["WIFI_SSID"]) + "\n")
              f.write("wifi_password: " + json.dumps(os.environ["WIFI_PASSWORD"]) + "\n")
              f.write('domain: ".local"\n')
          PY

      - name: Compile firmware
        run: esphome compile anern_yambms.yaml

      - name: Upload firmware files
        uses: .esphome/build/anern-yambms/build/firmware.ota.bin
        with:
          name: anern-yambms-firmware
          path: .esphome/build/anern-yambms/.pioenvs/anern-yambms/firmware*.bin
          if-no-files-found: error
          retention-days: 14
